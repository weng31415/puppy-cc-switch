name: Publish Release Assets to R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag containing the verified desktop artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          ls -lh release-assets

      - name: Validate installers and generate release manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DOWNLOAD_BASE_URL: https://pub-46dbf53707f84a02979c772ef87254ab.r2.dev/downloads
        run: |
          set -euo pipefail
          node scripts/generate-release-manifests.mjs \
            --dir=release-assets \
            --release="$RELEASE_TAG" \
            --base-url="$DOWNLOAD_BASE_URL"

          linux_deb="$(find release-assets -maxdepth 1 -type f -name '*-Ubuntu-x86_64.deb' -print -quit)"
          scripts/verify-linux-deb-updater.sh "$linux_deb"

      - name: Upload release assets to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || \
             [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || \
             [ -z "${R2_ACCOUNT_ID:-}" ] || \
             [ -z "${R2_BUCKET:-}" ]; then
            echo "Cloudflare R2 secrets are missing." >&2
            exit 1
          fi

          python3 -m pip install --user awscli
          export PATH="$HOME/.local/bin:$PATH"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp release-assets/ "s3://${R2_BUCKET}/downloads/" \
            --recursive \
            --exclude "latest.json" \
            --exclude "manual-latest.json" \
            --endpoint-url "$endpoint" \
            --cache-control "public, max-age=31536000, immutable"

          for manifest in latest.json manual-latest.json; do
            aws s3 cp "release-assets/$manifest" \
              "s3://${R2_BUCKET}/downloads/$manifest" \
              --endpoint-url "$endpoint" \
              --cache-control "no-cache, max-age=60" \
              --content-type "application/json"
          done

name: Publish Release Assets to R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag containing the verified desktop artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    concurrency:
      group: puppyrouter-public-downloads
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          ls -lh release-assets

      - name: Install release verification tools
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Validate installers and generate release manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DOWNLOAD_BASE_URL: https://pub-46dbf53707f84a02979c772ef87254ab.r2.dev/downloads
        run: |
          set -euo pipefail
          node scripts/generate-release-manifests.mjs \
            --dir=release-assets \
            --release="$RELEASE_TAG" \
            --base-url="$DOWNLOAD_BASE_URL"

          for linux_deb in release-assets/*.deb; do
            scripts/verify-linux-deb-updater.sh "$linux_deb"
          done

          macos_updater="$(find release-assets -maxdepth 1 -type f -name '*-macOS.tar.gz' -print -quit)"
          python3 scripts/verify-macos-updater.py "$macos_updater"

      - name: Upload release assets to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/publish-release-downloads.sh release-assets
